<!doctype html>

  <script>
    // 핸드폰에서는 컴퓨터와 같은 화면(가로 1280px)을 폰 화면 폭에 맞게 줄여서 보여 줘요.
    // 어떤 폰 브라우저(카카오톡 안 브라우저 등)는 처음 읽은 화면 설정만 쓰기 때문에, 처음부터 핸드폰용 설정을 넣어요.
    (function () {
      var PAGE = 1280;
      var small = Math.min(screen.width, screen.height) < 600;
      var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      var phone = small && touch;
      document.write('<meta name="viewport" id="vp" content="' + (phone ? 'width=' + PAGE : 'width=device-width, initial-scale=1') + '">');
      if (!phone) return;
      document.documentElement.className += ' phone';
      // 화면이 뜬 뒤 '실제로 보이는 폭'을 재서 딱 맞춰요.
      // (가로로 들면 카메라 구멍·버튼 막대 때문에 보이는 폭이 화면 크기보다 좁은 폰이 있어요)
      function refit() {
        var vv = window.visualViewport;
        if (!vv) return;
        var shown = vv.width * vv.scale;           // 지금 보이는 폭
        if (Math.abs(vv.width - PAGE) < 2) return;  // 이미 딱 맞아요
        var s = Math.min(1, shown / PAGE).toFixed(4);
        document.getElementById('vp').setAttribute('content', 'width=' + PAGE + ', initial-scale=' + s);
      }
      window.addEventListener('load', function () { setTimeout(refit, 50); });
      window.addEventListener('orientationchange', function () { setTimeout(refit, 300); });
    })();
  </script>

  <!-- 핸드폰을 세로로 들었을 때: 가로로 돌리라는 안내 -->
  <div class="rotate-hint" id="rotate-hint" role="dialog" aria-modal="true" aria-labelledby="rotate-h">
    <div class="rh-phone" aria-hidden="true"><span>📚</span></div>
    <h2 id="rotate-h">핸드폰을 가로로 돌려 주세요</h2>
    <p>도서관 탐험대는 가로 화면에서 컴퓨터처럼 볼 수 있어요.</p>
    <button type="button" class="btn primary big" id="rh-full">⛶ 전체 화면 가로로 보기</button>
    <button type="button" class="btn" id="rh-skip">세로로 계속하기</button>
    <p class="rh-note">화면이 돌아가지 않으면 핸드폰의 ‘화면 자동 회전’을 켜 주세요.</p>
  </div>
  <script>
    (function () {
      var hint = document.getElementById('rotate-hint');
      document.getElementById('rh-skip').onclick = function () { hint.classList.add('off'); };
      document.getElementById('rh-full').onclick = function () {
        var el = document.documentElement;
        var go = el.requestFullscreen || el.webkitRequestFullscreen;
        var p = go ? go.call(el) : null;
        var lock = function () { try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) { /* 지원하지 않는 폰 */ } };
        if (p && p.then) p.then(lock).catch(function () {}); else lock();
      };
    })();
  </script>
